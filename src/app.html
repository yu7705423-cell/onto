<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>文档合并拆分</title>
<style>
:root {
  --bg: #f4f4f5;
  --panel: #ffffff;
  --text: #18181b;
  --muted: #71717a;
  --faint: #a1a1aa;
  --border: #e4e4e7;
  --hover: #f4f4f5;
  --press: #ececee;
  --chip: #f1f1f3;
  --chip-strong: #3f3f46;
  --chip-strong-text: #fafafa;
  --primary: #27272a;
  --primary-text: #fafafa;
  --danger: #c4320a;
  --swipe-gray: #a1a1aa;
  --swipe-dark: #52525b;
  --swipe-red: #dc3b2f;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 2px 12px rgba(0,0,0,.03);
  --pop-shadow: 0 8px 30px rgba(0,0,0,.16);
  --pre-bg: #fafafa;
  --bar-bg: rgba(255,255,255,.86);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e0e10; --panel: #18181b; --text: #e4e4e7; --muted: #a1a1aa; --faint: #71717a;
    --border: #2a2a2f; --hover: #202024; --press: #26262b; --chip: #26262a; --chip-strong: #d4d4d8; --chip-strong-text: #18181b;
    --primary: #e4e4e7; --primary-text: #18181b; --danger: #f97066;
    --swipe-gray: #52525b; --swipe-dark: #3f3f46; --swipe-red: #c2342a;
    --shadow: 0 1px 2px rgba(0,0,0,.4); --pop-shadow: 0 8px 30px rgba(0,0,0,.5);
    --pre-bg: #131316; --bar-bg: rgba(24,24,27,.86);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e0e10; --panel: #18181b; --text: #e4e4e7; --muted: #a1a1aa; --faint: #71717a;
  --border: #2a2a2f; --hover: #202024; --press: #26262b; --chip: #26262a; --chip-strong: #d4d4d8; --chip-strong-text: #18181b;
  --primary: #e4e4e7; --primary-text: #18181b; --danger: #f97066;
  --swipe-gray: #52525b; --swipe-dark: #3f3f46; --swipe-red: #c2342a;
  --shadow: 0 1px 2px rgba(0,0,0,.4); --pop-shadow: 0 8px 30px rgba(0,0,0,.5);
  --pre-bg: #131316; --bar-bg: rgba(24,24,27,.86);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  -webkit-tap-highlight-color: transparent;
}
body.layer-open { overflow: hidden; }
button { font: inherit; color: inherit; }
svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
svg.i.lg { width: 30px; height: 30px; stroke-width: 1.5; }
.hidden { display: none !important; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.spacer { flex: 1; }
.err-text { color: var(--danger); }

/* ---------- 按钮 ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  font-size: 14px; padding: 8px 14px; border-radius: 10px; cursor: pointer; min-height: 38px;
  border: 1px solid var(--border); background: var(--panel); color: var(--text); white-space: nowrap;
}
.btn:hover { background: var(--hover); }
.btn:active { background: var(--press); }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-text); font-weight: 600; }
.btn.primary:hover { opacity: .9; }
.btn.danger { color: var(--danger); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.iconbtn {
  display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; flex: none;
  border: 0; border-radius: 10px; background: none; color: var(--text); cursor: pointer;
}
.iconbtn:hover { background: var(--hover); }
.iconbtn:active { background: var(--press); }
.iconbtn svg.i { width: 22px; height: 22px; }
.textbtn { border: 0; background: none; color: var(--text); font-weight: 600; font-size: 14px; padding: 6px 10px; border-radius: 8px; cursor: pointer; white-space: nowrap; }
.textbtn:hover { background: var(--hover); }
.textbtn:disabled { opacity: .4; }

/* ---------- 外框：顶栏 + 标签栏 ---------- */
.app { max-width: 820px; margin: 0 auto; padding: 0 16px 40px; }
.appbar { display: flex; align-items: center; gap: 8px; padding: 22px 0 10px; }
.brand { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; }
.logo { width: 38px; height: 38px; border-radius: 10px; background: var(--primary); color: var(--primary-text); display: flex; align-items: center; justify-content: center; flex: none; }
.logo svg.i { width: 21px; height: 21px; }
.appbar h1 { margin: 0; font-size: 19px; line-height: 1.2; }
.appbar .desc { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.appbar .page-name { display: none; }
.appbar-actions { display: flex; gap: 2px; }
.tabbar { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
.tab {
  position: relative; display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; color: var(--muted);
  font-weight: 600; padding: 10px 14px; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px;
}
.tab:hover { color: var(--text); }
.tab.active { color: var(--text); border-bottom-color: var(--text); }
.badge { min-width: 18px; padding: 0 6px; border-radius: 9px; background: var(--chip); color: var(--muted); font-size: 11px; line-height: 18px; text-align: center; font-weight: 600; }
.badge:empty { display: none; }

/* ---------- 列表（像聊天列表） ---------- */
.list-head { display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 4px 4px 6px; color: var(--muted); font-size: 13px; flex-wrap: wrap; }
.list { list-style: none; margin: 0; padding: 0; background: var(--panel); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
.list:empty { display: none; }
.row { position: relative; overflow: hidden; }
.row + .row .row-front::before { content: ""; position: absolute; top: 0; left: 66px; right: 0; border-top: 1px solid var(--border); }
.row-back { position: absolute; top: 0; bottom: 0; right: 0; display: flex; visibility: hidden; }
.row.swiped .row-back { visibility: visible; }
.row-back button { border: 0; color: #fff; font-size: 14px; width: 74px; cursor: pointer; }
.row-back .gray { background: var(--swipe-gray); }
.row-back .dark { background: var(--swipe-dark); }
.row-back .red { background: var(--swipe-red); }
.row-front {
  position: relative; display: flex; align-items: center; gap: 12px; padding: 11px 12px; min-height: 64px;
  background: var(--panel); cursor: pointer; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  touch-action: pan-y; transition: transform .22s ease, background .1s;
}
.row-front.pressed { background: var(--press); }
.row-front:focus { outline: none; }
.row-front:focus-visible { outline: 2px solid var(--faint); outline-offset: -2px; }
@media (hover: hover) and (pointer: fine) { .row-front:hover { background: var(--hover); } }
.avatar {
  width: 42px; height: 42px; border-radius: 10px; flex: none; display: flex; align-items: center; justify-content: center;
  font-size: 10.5px; font-weight: 700; letter-spacing: .3px; background: var(--chip); color: var(--muted); border: 1px solid var(--border);
}
.avatar.docx, .avatar.merge { background: var(--chip-strong); color: var(--chip-strong-text); border-color: var(--chip-strong); }
.avatar.err { color: var(--danger); border-color: currentColor; background: transparent; }
.avatar svg.i { width: 20px; height: 20px; }
.row-main { flex: 1; min-width: 0; }
.row-title { font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-sub { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 1px; }
.row-sub:empty { display: none; }
.row-right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; font-size: 12px; color: var(--faint); flex: none; align-self: flex-start; padding-top: 2px; }
.row-hover { display: none; gap: 2px; flex: none; }
.row-hover .iconbtn { width: 34px; height: 34px; color: var(--muted); }
.row-hover .iconbtn svg.i { width: 18px; height: 18px; }
@media (hover: hover) and (pointer: fine) {
  .list:not(.sorting) .row-front:hover .row-hover { display: flex; }
  .list:not(.sorting) .row-front:hover .row-right { display: none; }
}
.handle { display: none; align-items: center; justify-content: center; width: 40px; height: 40px; margin: -8px -6px -8px 0; color: var(--faint); touch-action: none; cursor: grab; flex: none; }
.handle svg.i { width: 22px; height: 22px; }
.list.sorting .handle { display: flex; }
.list.sorting .row-right { display: none; }
.row.lifted { z-index: 5; box-shadow: var(--pop-shadow); }
.row.lifted .row-front { background: var(--panel); transition: none; }
.row.drop-before .row-front { box-shadow: inset 0 2px 0 var(--text); }
.row.drop-after .row-front { box-shadow: inset 0 -2px 0 var(--text); }
mark { background: var(--chip-strong); color: var(--chip-strong-text); border-radius: 3px; padding: 0 2px; }

.chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.chip { border: 1px solid var(--border); background: var(--panel); border-radius: 999px; padding: 4px 12px; font-size: 13px; color: var(--text); cursor: pointer; }
.chip:hover { background: var(--hover); }
.chip.on { background: var(--primary); color: var(--primary-text); border-color: var(--primary); }

/* ---------- 空状态 / 拖入 ---------- */
.empty-state { text-align: center; padding: 44px 16px 36px; color: var(--muted); background: var(--panel); border: 1.5px dashed var(--border); border-radius: 14px; }
.empty-state .big { width: 64px; height: 64px; border-radius: 18px; background: var(--chip); color: var(--muted); display: inline-flex; align-items: center; justify-content: center; margin-bottom: 12px; }
.empty-state h3 { margin: 0 0 4px; color: var(--text); font-size: 16px; }
.empty-state p { margin: 0 0 18px; font-size: 13px; }
.empty-state .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.empty-state .actions .btn { min-width: 128px; }
.empty-plain { text-align: center; color: var(--faint); padding: 36px 0; }
.drop-overlay { position: fixed; inset: 0; z-index: 80; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.35); pointer-events: none; }
.drop-overlay div { background: var(--panel); border: 2px dashed var(--text); border-radius: 16px; padding: 28px 40px; font-size: 16px; font-weight: 600; display: flex; gap: 10px; align-items: center; }
body.dragging-files .drop-overlay { display: flex; }

/* ---------- 搜索 ---------- */
.searchbar { position: relative; display: flex; align-items: center; margin-bottom: 10px; }
.searchbar svg.i { position: absolute; left: 11px; color: var(--faint); pointer-events: none; }
.searchbar input { width: 100%; height: 40px; border: 0; border-radius: 10px; background: var(--chip); color: var(--text); padding: 0 12px 0 36px; font: inherit; font-size: 15px; }
.searchbar input:focus { outline: 2px solid var(--border); }
.foot-info { text-align: center; color: var(--faint); font-size: 12px; padding: 14px 0; }

/* ---------- 底部合并栏（像聊天输入框） ---------- */
.composer {
  position: sticky; bottom: 14px; margin-top: 14px; z-index: 20; display: flex; gap: 8px; align-items: center;
  padding: 8px; background: var(--panel); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--pop-shadow);
}
.composer input { flex: 1; min-width: 0; height: 40px; border: 0; border-radius: 10px; background: var(--chip); color: var(--text); padding: 0 12px; font: inherit; font-size: 15px; }
.composer input:focus { outline: 2px solid var(--border); }
.fmt-chip { height: 40px; padding: 0 10px; border-radius: 10px; border: 1px solid var(--border); background: var(--panel); font-size: 12px; font-weight: 700; letter-spacing: .4px; cursor: pointer; color: var(--muted); flex: none; }
.sendbtn { height: 40px; padding: 0 16px; border-radius: 10px; border: 0; background: var(--primary); color: var(--primary-text); font-weight: 600; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; flex: none; }
.sendbtn:disabled { opacity: .35; cursor: not-allowed; }

/* ---------- 浮层：页面 / 底部菜单 / 长按菜单 ---------- */
.layer-bg { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; padding: 24px; background: rgba(0,0,0,.4); animation: fade .15s; }
.menu-bg { background: transparent; animation: none; padding: 0; display: block; }
.page { width: 100%; max-width: 760px; height: min(880px, 90vh); background: var(--bg); border-radius: 16px; display: flex; flex-direction: column; overflow: hidden; box-shadow: var(--pop-shadow); }
.page-bar { flex: none; display: flex; align-items: center; gap: 4px; height: 54px; padding: 0 6px; background: var(--panel); border-bottom: 1px solid var(--border); }
.page-bar h2 { flex: 1; min-width: 0; margin: 0; text-align: center; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-l, .bar-r { min-width: 80px; display: flex; align-items: center; }
.bar-r { justify-content: flex-end; }
.page-body { flex: 1; overflow: auto; padding: 14px; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.page-body.flush { padding: 0; display: flex; flex-direction: column; }
.page-foot { flex: none; display: flex; gap: 8px; padding: 10px 12px; background: var(--panel); border-top: 1px solid var(--border); }
.page-foot .btn { flex: 1; min-height: 44px; }
.sheet-bg { align-items: center; }
.sheet { width: 100%; max-width: 400px; background: var(--panel); border-radius: 16px; padding: 6px; box-shadow: var(--pop-shadow); }
.sheet-title { padding: 10px 14px 8px; font-size: 13px; color: var(--muted); text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sheet-item { display: flex; align-items: center; gap: 12px; width: 100%; border: 0; background: none; font-size: 16px; padding: 13px 16px; border-radius: 10px; cursor: pointer; text-align: left; }
.sheet-item:hover, .sheet-item:active { background: var(--hover); }
.sheet-item .hint { margin-left: auto; color: var(--faint); font-size: 13px; }
.sheet-item.danger { color: var(--danger); }
.sheet-item:disabled { opacity: .35; }
.sheet-item.cancel { justify-content: center; color: var(--muted); border-top: 6px solid var(--bg); border-radius: 0; margin-top: 4px; }
.menu { position: fixed; min-width: 176px; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 5px; box-shadow: var(--pop-shadow); animation: pop .12s ease-out; }
.menu-item { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: none; font-size: 15px; padding: 10px 12px; border-radius: 8px; cursor: pointer; text-align: left; white-space: nowrap; }
.menu-item:hover, .menu-item:active { background: var(--hover); }
.menu-item.danger { color: var(--danger); }
.menu-item:disabled { opacity: .35; }
.menu-sep { height: 1px; background: var(--border); margin: 4px 6px; }
@keyframes fade { from { opacity: 0; } }
@keyframes pop { from { opacity: 0; transform: scale(.96); } }
@keyframes slide { from { transform: translateX(40%); opacity: .4; } }
@keyframes up { from { transform: translateY(40%); } }

/* ---------- 设置（分组单元格） ---------- */
.group-title { font-size: 12px; color: var(--muted); padding: 14px 6px 6px; }
.group { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
.cell { display: flex; align-items: center; gap: 10px; padding: 12px 14px; min-height: 50px; }
.cell + .cell { border-top: 1px solid var(--border); }
.cell .label { flex: 1; font-size: 15px; }
.cell.col { flex-direction: column; align-items: stretch; }
.cell textarea { width: 100%; font: inherit; font-size: 14px; padding: 10px; border: 1px solid var(--border); border-radius: 10px; background: var(--bg); color: var(--text); resize: vertical; min-height: 80px; }
.group .sheet-item { border-radius: 0; margin: 0; }
.group-note { font-size: 12px; color: var(--muted); padding: 8px 6px 0; }
.switch { appearance: none; -webkit-appearance: none; width: 46px; height: 28px; border-radius: 14px; background: var(--border); position: relative; cursor: pointer; transition: background .15s; flex: none; margin: 0; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .15s; }
.switch:checked { background: var(--primary); }
.switch:checked::after { transform: translateX(18px); background: var(--primary-text); }
.seg { display: inline-flex; background: var(--chip); border-radius: 9px; padding: 2px; }
.seg button { border: 0; background: none; padding: 5px 14px; border-radius: 7px; font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer; }
.seg button.on { background: var(--panel); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.12); }

/* ---------- 编辑 / 预览 ---------- */
.editor-name { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--panel); border-bottom: 1px solid var(--border); }
.editor-name label { color: var(--muted); font-size: 13px; flex: none; }
.editor-name input { flex: 1; min-width: 0; border: 0; background: none; color: var(--text); font: inherit; font-size: 15px; padding: 6px 0; outline: none; }
.editor-text { flex: 1; width: 100%; border: 0; resize: none; padding: 14px; background: var(--panel); color: var(--text); outline: none; font: 15px/1.7 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
.editor-count { padding: 6px 14px; font-size: 12px; color: var(--faint); background: var(--panel); border-top: 1px solid var(--border); }
.doc-view { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 20px 22px; font-size: 14px; line-height: 1.75; }
.doc-view .p { white-space: pre-wrap; word-break: break-word; min-height: 1.75em; }
.doc-view .t { font-size: 19px; font-weight: 700; margin-bottom: 4px; }
.doc-view .meta { color: var(--muted); font-size: 13px; }
.doc-view .b { margin: 18px 0 6px; padding: 4px 10px; background: var(--chip); border-left: 3px solid var(--text); font-weight: 600; font-size: 13px; word-break: break-all; }
.doc-view .e { margin: 6px 0 4px; padding: 2px 10px; color: var(--faint); font-size: 12px; border-left: 3px solid var(--border); word-break: break-all; }
.doc-view .more-note { color: var(--muted); text-align: center; padding: 16px 0 0; }
.summary { display: flex; align-items: center; gap: 12px; padding: 14px; background: var(--panel); border: 1px solid var(--border); border-radius: 14px; margin-bottom: 4px; }
.summary .avatar { width: 48px; height: 48px; }
.summary .s-title { font-size: 16px; font-weight: 600; word-break: break-all; }
.summary .s-sub { font-size: 13px; color: var(--muted); }

/* ---------- 提示 ---------- */
#toasts { position: fixed; left: 50%; transform: translateX(-50%); bottom: 96px; z-index: 90; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; width: max-content; max-width: calc(100% - 32px); }
.toast { background: rgba(24,24,27,.92); color: #fafafa; padding: 10px 16px; border-radius: 10px; font-size: 14px; text-align: center; animation: fade .2s; box-shadow: var(--pop-shadow); }
.toast.err { background: var(--swipe-red); }
.wx-tip { display: flex; gap: 8px; align-items: flex-start; background: var(--chip); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; margin: 12px 0 0; font-size: 13px; }
@media (pointer: coarse) { .no-touch { display: none !important; } }

/* ---------- 手机 ---------- */
@media (max-width: 640px) {
  .app { padding: 0 0 calc(76px + env(safe-area-inset-bottom)); }
  .app.with-composer { padding-bottom: calc(140px + env(safe-area-inset-bottom)); }
  .appbar {
    position: sticky; top: 0; z-index: 30; padding: calc(6px + env(safe-area-inset-top)) 8px 6px 16px; min-height: 52px;
    background: var(--bar-bg); -webkit-backdrop-filter: saturate(1.6) blur(16px); backdrop-filter: saturate(1.6) blur(16px);
  }
  .appbar .logo, .appbar .desc, .appbar .app-name { display: none; }
  .appbar .page-name { display: block; font-size: 20px; }
  .wx-tip { margin: 8px 12px 0; }
  .tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; margin: 0; gap: 0; border-top: 1px solid var(--border); border-bottom: 0;
    background: var(--bar-bg); -webkit-backdrop-filter: saturate(1.6) blur(16px); backdrop-filter: saturate(1.6) blur(16px);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .tab { flex: 1; flex-direction: column; gap: 2px; padding: 7px 0 5px; font-size: 11px; font-weight: 500; border: 0; margin: 0; color: var(--faint); }
  .tab svg.i { width: 24px; height: 24px; }
  .tab.active { color: var(--text); }
  .tab .badge { position: absolute; top: 3px; left: calc(50% + 8px); background: var(--chip-strong); color: var(--chip-strong-text); }
  main { padding: 6px 0 0; }
  .list-head, .searchbar, .chips.filter, .settings-inline { padding-left: 16px; padding-right: 12px; }
  .searchbar { margin: 0 12px 10px; padding: 0; }
  .list { border-radius: 0; border-left: 0; border-right: 0; }
  .empty-state { margin: 8px 12px; }
  .composer {
    position: fixed; left: 0; right: 0; bottom: calc(57px + env(safe-area-inset-bottom)); margin: 0; border-radius: 0;
    border-left: 0; border-right: 0; border-bottom: 0; box-shadow: none; padding: 8px 10px; background: var(--bar-bg);
    -webkit-backdrop-filter: saturate(1.6) blur(16px); backdrop-filter: saturate(1.6) blur(16px);
  }
  input, textarea, select, .composer input, .searchbar input { font-size: 16px !important; }

  file: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/><path d="M8 13h8M8 17h5"/>',
  files: '<path d="M15 2H8a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7Z"/><path d="M15 2v5h5"/><path d="M4 7v13a2 2 0 0 0 2 2h10"/>',

function icon(name, cls = '') {
  const t = document.createElement('template');
  t.innerHTML = `<svg class="i ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[name] || ''}</svg>`;
  return t.content.firstChild;
}
const ibtn = (cls, name, label, attrs = {}) => h('button', { class: 'btn ' + cls, ...attrs }, icon(name), label);

function toast(msg, isErr) {
  const el = h('div', { class: 'toast' + (isErr ? ' err' : '') }, msg);
  $('#toasts').append(el);
  while ($('#toasts').children.length > 2) $('#toasts').firstChild.remove();
  setTimeout(() => el.remove(), isErr ? 5000 : 2600);

function saveBlob(blob, name) {
  const a = h('a', { href: URL.createObjectURL(blob), download: name });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
}

// 先按 UTF-8 严格解码，失败再按 GB18030（兼容 GBK 的中文 txt）
function decodeText(bytes) {
  const u8 = bytes instanceof Uint8Array ? bytes : new Uint8Array(bytes);
  if (u8[0] === 0xFF && u8[1] === 0xFE) return new TextDecoder('utf-16le').decode(u8.subarray(2));
  if (u8[0] === 0xFE && u8[1] === 0xFF) return new TextDecoder('utf-16be').decode(u8.subarray(2));
  try { return new TextDecoder('utf-8', { fatal: true }).decode(u8).replace(/^﻿/, ''); }
  catch { return new TextDecoder('gb18030').decode(u8); }
}
const normalizeNL = s => s.replace(/\r\n?/g, '\n');

// ---------- DOCX 读写 ----------
const W_NS = 'http://schemas.openxmlformats.org/wordprocessingml/2006/main';
const SKIP_IN_PARA = new Set(['pPr', 'rPr', 'Fallback', 'txbxContent', 'delText', 'instrText']);

async function docxToText(data) {
  const zip = await JSZip.loadAsync(data);
  const f = zip.file('word/document.xml');
  if (!f) throw new Error('不是有效的 docx');
  const doc = new DOMParser().parseFromString(await f.async('string'), 'application/xml');
  if (doc.getElementsByTagName('parsererror').length) throw new Error('docx 内容解析失败');
  const body = doc.getElementsByTagNameNS(W_NS, 'body')[0];
  const lines = [];
  const paraText = p => {
    let s = '';
    (function rec(n) {
      for (const el of n.children) {
        const ln = el.localName;
        if (SKIP_IN_PARA.has(ln)) continue;
        if (el.namespaceURI === W_NS) {
          if (ln === 't') { s += el.textContent; continue; }
          if (ln === 'tab') { s += '\t'; continue; }
          if (ln === 'br' || ln === 'cr') { s += '\n'; continue; }
          if (ln === 'noBreakHyphen') { s += '-'; continue; }
        }
        rec(el);
      }
    })(p);
    return s;
  };
  (function walk(n) {
    for (const el of n.children) {
      const ln = el.localName;
      if (ln === 'sectPr' || ln === 'Fallback') continue;
      if (el.namespaceURI === W_NS && ln === 'p') lines.push(paraText(el));
      else walk(el);
    }
  })(body);
  return lines.join('\n');
}

const xmlEsc = s => s
  .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F￾￿]/g, '')
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

const PARA_STYLE = {
  plain: { p: '', r: '' },
  title: { p: '<w:spacing w:after="120"/>', r: '<w:b/><w:sz w:val="36"/><w:szCs w:val="36"/>' },
  meta: { p: '', r: '<w:color w:val="6B7280"/><w:sz w:val="20"/><w:szCs w:val="20"/>' },
  begin: { p: '<w:keepNext/><w:shd w:val="clear" w:color="auto" w:fill="DEEAF6"/><w:spacing w:before="360" w:after="120"/>', r: '<w:b/><w:color w:val="1F4E79"/>' },
  end: { p: '<w:shd w:val="clear" w:color="auto" w:fill="F2F2F2"/><w:spacing w:before="120" w:after="120"/>', r: '<w:color w:val="7F7F7F"/><w:sz w:val="18"/><w:szCs w:val="18"/>' },
};

function paraXml(text, kind = 'plain') {
  const st = PARA_STYLE[kind];
  const rPr = st.r ? `<w:rPr>${st.r}</w:rPr>` : '';
  const runs = text.split('\t').map(t => t ? `<w:r>${rPr}<w:t xml:space="preserve">${xmlEsc(t)}</w:t></w:r>` : '')
    .join(`<w:r>${rPr}<w:tab/></w:r>`);
  return `<w:p>${st.p ? `<w:pPr>${st.p}</w:pPr>` : ''}${runs}</w:p>`;
}

// paras: [{ text, kind }]，一项一个段落
async function buildDocx(paras) {
  const zip = new JSZip();
  zip.file('[Content_Types].xml', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
    '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
    '<Default Extension="xml" ContentType="application/xml"/>' +
    '<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>' +
    '<Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/>' +
    '</Types>');
  zip.file('_rels/.rels', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
    '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>' +
    '</Relationships>');
  zip.file('word/_rels/document.xml.rels', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
    '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>' +
    '</Relationships>');
  zip.file('word/styles.xml', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    `<w:styles xmlns:w="${W_NS}"><w:docDefaults><w:rPrDefault><w:rPr>` +
    '<w:rFonts w:ascii="Calibri" w:hAnsi="Calibri" w:eastAsia="Microsoft YaHei" w:cs="Calibri"/>' +
    '<w:sz w:val="21"/><w:szCs w:val="21"/><w:lang w:val="en-US" w:eastAsia="zh-CN"/>' +
    '</w:rPr></w:rPrDefault><w:pPrDefault><w:pPr><w:spacing w:after="0" w:line="320" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults>' +
    '<w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/><w:qFormat/></w:style>' +
    '</w:styles>');
  zip.file('word/document.xml', '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    `<w:document xmlns:w="${W_NS}"><w:body>` +
    paras.map(p => paraXml(p.text, p.kind)).join('') +
    '<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1440" w:right="1440" w:bottom="1440" w:left="1440" w:header="720" w:footer="720" w:gutter="0"/></w:sectPr>' +
    '</w:body></w:document>');
  return zip.generateAsync({
    type: 'blob', compression: 'DEFLATE',
    mimeType: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document',
  });
}

const textToDocx = text => buildDocx(text.split('\n').map(t => ({ text: t })));
const txtBlob = text => new Blob(['﻿' + text.replace(/\n/g, '\r\n')], { type: 'text/plain;charset=utf-8' });

// ---------- 合并 / 拆分格式 ----------
const TITLE_PREFIX = '【文档合集】';
const beginLine = (i, n, name) => `<<<<<<<<<< 文件 ${i}/${n} 开始：${name} >>>>>>>>>>`;
const endLine = (i, n, name) => `<<<<<<<<<< 文件 ${i}/${n} 结束：${name} >>>>>>>>>>`;
const BEGIN_RE = /^\s*<{3,}\s*文件\s*\d+\s*\/\s*\d+\s*开始\s*[:：]\s*(.*?)\s*>{3,}\s*$/;
const END_RE = /^\s*<{3,}\s*文件\s*\d+\s*\/\s*\d+\s*结束\s*[:：]\s*(.*?)\s*>{3,}\s*$/;

// 合并文件开头放什么：标题+统计、说明文字、目录，都可以关掉
const DEFAULT_INTRO = '本文件由「文档合并拆分」工具生成，导回工具即可按原文件名拆分。请勿改动 <<<<< 分隔行 >>>>>。';
const DEFAULT_HEADER = { title: true, toc: true, intro: DEFAULT_INTRO };

// 生成合并内容：返回段落数组，txt 直接按行拼接，docx 每行一个段落
function mergedParas(title, files, header = DEFAULT_HEADER) {
  const n = files.length;
  const paras = [];
  if (header.title) {
    paras.push({ text: TITLE_PREFIX + title, kind: 'title' });
    paras.push({ text: `共 ${n} 个文件 · 生成于 ${fmtTime(Date.now())}`, kind: 'meta' });
  }
  if (header.intro && header.intro.trim()) {
    for (const line of normalizeNL(header.intro.trim()).split('\n')) paras.push({ text: line, kind: 'meta' });
  }
  if (header.toc) {
    paras.push({ text: '目录：', kind: 'meta' });
    files.forEach((f, i) => paras.push({ text: `${i + 1}. ${f.name}`, kind: 'meta' }));
  }
  if (paras.length) paras.push({ text: '' });
  files.forEach((f, i) => {
    paras.push({ text: beginLine(i + 1, n, f.name), kind: 'begin' });
    for (const line of normalizeNL(f.text).split('\n')) paras.push({ text: line });
    paras.push({ text: endLine(i + 1, n, f.name), kind: 'end' });
    paras.push({ text: '' });
  });
  return paras;
}

async function mergedBlob(title, files, format, header) {
  const paras = mergedParas(title, files, header);
  return format === 'docx' ? buildDocx(paras) : txtBlob(paras.map(p => p.text).join('\n'));
}

const markerLine = text => normalizeNL(text).split('\n').find(l => BEGIN_RE.test(l) || END_RE.test(l));

function parseMerged(text) {
  const lines = normalizeNL(text).split('\n');
  let title = null, cur = null;
  const files = [];
  for (const line of lines) {
    let m;
    if ((m = BEGIN_RE.exec(line))) {
      if (cur) files.push(cur);
      cur = { name: m[1] || `文件${files.length + 1}.txt`, lines: [] };
    } else if (cur && END_RE.test(line)) {
      files.push(cur); cur = null;
    } else if (cur) {
      cur.lines.push(line);
    } else if (title == null && line.startsWith(TITLE_PREFIX)) {
      title = line.slice(TITLE_PREFIX.length).trim();
    }
  }
  if (cur) files.push(cur);
  return { title, files: files.map(f => ({ name: f.name, text: f.lines.join('\n') })) };
}

// 目标格式：orig 按原扩展名；txt / docx 强制
function outputOf(name, mode) {
  const ext = extOf(name);
  const t = mode === 'orig' ? typeOf(name) : mode;
  let out = name;
  if (t === 'docx' && ext !== 'docx') out = (ext === 'txt' ? stripExt(name) : name) + '.docx';
  if (t === 'txt' && ext === 'docx') out = stripExt(name) + '.txt';
  if (t === 'txt' && !ext) out = name + '.txt';
  return { type: t, name: out };
}

async function fileBlob(f, mode) {
  const o = outputOf(f.name, mode);
  return { name: o.name, blob: o.type === 'docx' ? await textToDocx(f.text) : txtBlob(f.text) };
}

async function downloadFile(f, mode) {
  const { name, blob } = await fileBlob(f, mode);
  saveBlob(blob, safeName(baseName(name)));
}

async function downloadZip(title, files, mode) {
  const zip = new JSZip();
  const used = new Set();
  for (const f of files) {
    const { name, blob } = await fileBlob(f, mode);
    let path = name.split(/[\\/]/).filter(s => s && s !== '..' && s !== '.').map(safeName).join('/') || '未命名.txt';
    if (used.has(path.toLowerCase())) {
      const e = extOf(path), b = e ? path.slice(0, -(e.length + 1)) : path;
      let k = 2;
      while (used.has(`${b} (${k})${e ? '.' + e : ''}`.toLowerCase())) k++;
      path = `${b} (${k})${e ? '.' + e : ''}`;
    }
    used.add(path.toLowerCase());
    zip.file(path, blob);
  }
  saveBlob(await zip.generateAsync({ type: 'blob', compression: 'DEFLATE' }), safeName(title) + '.zip');
}

// ---------- 读取上传的文件 ----------
// 返回 [{ name, text, type, size, error? }]
async function readInputFile(name, data) {
  const ext = extOf(name);
  const size = data.byteLength ?? data.size ?? 0;
  if (ext === 'zip') {
    const zip = await JSZip.loadAsync(data, {
      decodeFileName: bytes => decodeText(bytes), // 兼容 Windows 下 GBK 编码的中文文件名
    });
    const out = [];
    const entries = [];
    zip.forEach((path, entry) => entries.push([path, entry]));
    entries.sort((a, b) => a[0].localeCompare(b[0], 'zh-CN', { numeric: true }));
    for (const [path, entry] of entries) {
      if (entry.dir || /(^|\/)(__MACOSX|\.DS_Store)(\/|$)/.test(path) || baseName(path).startsWith('._') || baseName(path).startsWith('~$')) continue;
      out.push(...await readInputFile(path, await entry.async('uint8array')));
    }
    return out;
  }
  try {
    if (ext === 'docx') return [{ name, type: 'docx', size, text: await docxToText(data) }];
    if (TEXT_EXTS.has(ext)) return [{ name, type: 'txt', size, text: normalizeNL(decodeText(new Uint8Array(data))) }];
    if (ext === 'doc') return [{ name, type: 'err', size, error: '旧版 .doc 不支持，请先另存为 .docx' }];
    return [{ name, type: 'err', size, error: '不支持的文件类型' }];
  } catch (e) {
    return [{ name, type: 'err', size, error: e.message || '读取失败' }];
  }
}

// ---------- 目录（IndexedDB） ----------
const DB = (() => {
  let dbp = null, memory = null;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    const req = indexedDB.open('doc-merge-split', 1);
    req.onupgradeneeded = () => req.result.createObjectStore('records', { keyPath: 'id' });
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej(req.error);
  }));
  const tx = async (mode, fn) => {
    if (memory) return fn(null);
    const db = await open();
    return new Promise((res, rej) => {
      const t = db.transaction('records', mode);
      const r = fn(t.objectStore('records'));
      t.oncomplete = () => res(r && r.result);
      t.onerror = () => rej(t.error);
    });
  };
  return {
    async init() {
      try { await open(); } catch { memory = new Map(); toast('浏览器不允许本地存储，目录只在本次打开期间有效', true); }
    },
    all: () => memory ? Promise.resolve([...memory.values()]) : tx('readonly', s => s.getAll()),
    put: rec => memory ? (memory.set(rec.id, rec), Promise.resolve()) : tx('readwrite', s => s.put(rec)),
    del: id => memory ? (memory.delete(id), Promise.resolve()) : tx('readwrite', s => s.delete(id)),
    clear: () => memory ? (memory.clear(), Promise.resolve()) : tx('readwrite', s => s.clear()),
  };
})();


const isTouch = () => matchMedia('(pointer: coarse)').matches;
const relTime = t => {
  const d = new Date(t), now = new Date(), same = (a, b) => a.toDateString() === b.toDateString();
  if (same(d, now)) return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  const y = new Date(now); y.setDate(now.getDate() - 1);
  if (same(d, y)) return '昨天';
  if (d.getFullYear() === now.getFullYear()) return `${d.getMonth() + 1}月${d.getDate()}日`;
  return `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}`;
};
const firstLine = text => (text.split('\n').find(l => l.trim()) || '').trim();
const run = fn => async (...args) => { try { await fn(...args); } catch (e) { console.error(e); toast(e.message || '操作失败', true); } };

// ---------- 浮层：页面 / 底部菜单 / 长按菜单。手机返回键会关掉最上面一层 ----------
const layers = [];
let armed = false, ignorePop = false;
const arm = () => { if (!armed) { history.pushState({ dmsLayer: 1 }, ''); armed = true; } };
window.addEventListener('popstate', () => {
  armed = false;
  if (ignorePop) { ignorePop = false; if (layers.length) arm(); return; }
  const top = layers[layers.length - 1];
  if (top) top.close(false, true);
  if (layers.length) arm();
});
document.addEventListener('keydown', e => {
  const top = layers[layers.length - 1];
  if (!top) return;
  if (e.key === 'Escape') top.close();
  else if (top.onKey) top.onKey(e);
});

function openLayer(kind, build) {
  const bg = h('div', { class: `layer-bg ${kind}-bg` });
  const api = {
    beforeClose: null, onKey: null,
    close(force, fromPop) {
      if (!layers.includes(api)) return;
      if (!force && api.beforeClose && !api.beforeClose()) return;
      layers.splice(layers.indexOf(api), 1);
      bg.remove();
      if (!layers.length) {
        document.body.classList.remove('layer-open');
        if (!fromPop && armed) { armed = false; ignorePop = true; history.back(); }
      }
    },
  };
  // 长按松手时那一下“点击”不算数，要等手指重新按下
  let fresh = true;
  bg.addEventListener('pointerdown', () => { fresh = false; }, true);
  bg.addEventListener('click', e => { if (fresh) { e.stopPropagation(); e.preventDefault(); } }, true);
  bg.addEventListener('click', e => { if (e.target === bg) api.close(); });
  build(bg, api);
  document.body.append(bg);
  document.body.classList.add('layer-open');
  layers.push(api);
  arm();
  return api;
}

// 全屏页面（电脑上是居中的大窗口）：build(api) 返回 { right, body, foot }
function openPage(title, build) {
  return openLayer('page', (bg, api) => {
    const titleEl = h('h2', {}, title);
    api.setTitle = t => { titleEl.textContent = t; };
    const { right = [], body, foot } = build(api);
    bg.append(h('div', { class: 'page', role: 'dialog', 'aria-label': title },
      h('div', { class: 'page-bar' },
        h('div', { class: 'bar-l' }, h('button', { class: 'iconbtn', title: '返回', 'aria-label': '返回', onclick: () => api.close() }, icon('back'))),
        titleEl,
        h('div', { class: 'bar-r' }, right)),
      body, foot || null));
  });
}

// 底部弹出的操作菜单（像微信点“…”出来的那种）
function sheet(title, items) {
  openLayer('sheet', (bg, api) => {
    bg.append(h('div', { class: 'sheet', role: 'menu' },
      title ? h('div', { class: 'sheet-title' }, title) : null,
      items.filter(Boolean).map(a => h('button', {
        class: 'sheet-item' + (a.danger ? ' danger' : ''), disabled: a.disabled, role: 'menuitem',
        onclick: () => { api.close(true); a.run(); },
      }, a.icon ? icon(a.icon) : null, a.label, a.hint ? h('span', { class: 'hint' }, a.hint) : null)),

// 长按 / 右键 / “+”弹出的小菜单，出现在手指或鼠标旁边
function popMenu(x, y, items) {
  openLayer('menu', (bg, api) => {
    const m = h('div', { class: 'menu', role: 'menu' }, items.filter(Boolean).map(a => a === '-' ? h('div', { class: 'menu-sep' }) :
      h('button', { class: 'menu-item' + (a.danger ? ' danger' : ''), disabled: a.disabled, role: 'menuitem', onclick: () => { api.close(true); a.run(); } },
        a.icon ? icon(a.icon) : null, a.label)));
    bg.append(m);
    bg.addEventListener('contextmenu', e => { e.preventDefault(); api.close(true); });
    requestAnimationFrame(() => {
      const r = m.getBoundingClientRect();
      m.style.left = Math.max(8, Math.min(x, innerWidth - r.width - 8)) + 'px';
      m.style.top = (y + r.height > innerHeight - 8 ? Math.max(8, y - r.height) : y) + 'px';
    });
  });
}
const menuAt = (el, items) => { const r = el.getBoundingClientRect(); popMenu(r.right - 180, r.bottom + 4, items); };

// ---------- 列表行：点开、左滑、长按、右键 ----------
let openSwipe = null;
const hideBack = li => setTimeout(() => { if (openSwipe !== li) li.classList.remove('swiped'); }, 260);
const closeSwipe = () => {
  if (!openSwipe) return;
  const li = openSwipe;
  li.querySelector('.row-front').style.transform = ''; openSwipe = null; hideBack(li);
};
document.addEventListener('pointerdown', e => { if (openSwipe && !openSwipe.contains(e.target)) closeSwipe(); }, true);

function listRow({ avatar, title, sub, right, onTap, menu, swipe = [], hover = [] }) {
  const back = h('div', { class: 'row-back' }, swipe.map(s => h('button', { class: s.cls || 'gray', onclick: e => { e.stopPropagation(); closeSwipe(); s.run(); } }, s.label)));
  const front = h('div', { class: 'row-front', tabindex: '0' },
    avatar,
    h('div', { class: 'row-main' }, h('div', { class: 'row-title' }, title), h('div', { class: 'row-sub' }, sub || '')),
    right ? h('div', { class: 'row-right' }, right) : null,
    hover.length || menu ? h('div', { class: 'row-hover' },
      hover.map(a => h('button', { class: 'iconbtn', title: a.label, 'aria-label': a.label, onclick: e => { e.stopPropagation(); a.run(); } }, icon(a.icon))),
      menu ? h('button', { class: 'iconbtn', title: '更多', 'aria-label': '更多', onclick: e => { e.stopPropagation(); menuAt(e.currentTarget, menu()); } }, icon('more')) : null) : null,
    h('span', { class: 'handle', title: '按住拖动', 'aria-label': '拖动排序' }, icon('handle')));
  const li = h('li', { class: 'row' }, swipe.length ? back : null, front);

  let sx = 0, sy = 0, base = 0, x = 0, timer = null, swiping = false, moved = false, longFired = false;
  const backW = () => back.offsetWidth;
  front.addEventListener('pointerdown', e => {
    if (e.target.closest('.handle, button') || li.parentNode?.classList.contains('sorting')) return;
    sx = e.clientX; sy = e.clientY; moved = swiping = longFired = false;
    base = openSwipe === li ? -backW() : 0; x = base;
    front.classList.add('pressed');
    if (e.pointerType !== 'mouse' && menu) {
      timer = setTimeout(() => {
        longFired = true; front.classList.remove('pressed');
        if (navigator.vibrate) navigator.vibrate(12);
        closeSwipe(); popMenu(sx, sy, menu());
      }, 480);
    }
  });
  front.addEventListener('pointermove', e => {
    if (!front.classList.contains('pressed') && !swiping) return;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (!swiping && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) {
      clearTimeout(timer); front.classList.remove('pressed'); moved = true;
      if (swipe.length && e.pointerType !== 'mouse' && Math.abs(dx) > Math.abs(dy)) {
        swiping = true; li.classList.add('swiped'); front.setPointerCapture(e.pointerId); front.style.transition = 'none';
        if (openSwipe && openSwipe !== li) closeSwipe();
      }
    }
    if (swiping) { x = Math.max(-backW() - 40, Math.min(0, base + dx)); front.style.transform = `translateX(${x}px)`; }
  });
  const end = () => {
    clearTimeout(timer); front.classList.remove('pressed');
    if (!swiping) return;
    swiping = false; front.style.transition = '';
    if (x < -backW() / 2) { front.style.transform = `translateX(${-backW()}px)`; openSwipe = li; }
    else { front.style.transform = ''; if (openSwipe === li) openSwipe = null; hideBack(li); }
  };
  front.addEventListener('pointerup', end);
  front.addEventListener('pointercancel', end);
  front.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse' && !swiping) { clearTimeout(timer); front.classList.remove('pressed'); } });
  front.addEventListener('click', e => {
    if (e.target.closest('button, .handle') || li.parentNode?.classList.contains('sorting')) return;
    if (longFired || moved) return;
    if (openSwipe) { closeSwipe(); return; }
    onTap && onTap();
  });
  front.addEventListener('keydown', e => { if (e.key === 'Enter' && onTap) onTap(); });
  front.addEventListener('contextmenu', e => {
    e.preventDefault(); clearTimeout(timer);
    if (longFired || !menu) return;
    longFired = true; closeSwipe(); popMenu(e.clientX, e.clientY, menu());
  });
  return li;
}

const fileAvatar = type => h('div', { class: 'avatar ' + type }, type === 'err' ? '!' : type.toUpperCase());

// ---------- 排序模式：按住右边的把手拖 ----------
function makeSortable(ul, onMove) {
  ul.addEventListener('pointerdown', e => {
    const handle = e.target.closest('.handle');
    if (!handle || !ul.classList.contains('sorting') || (e.pointerType === 'mouse' && e.button !== 0)) return;
    const li = handle.closest('li'), items = [...ul.children], from = items.indexOf(li);
    if (from < 0 || items.length < 2) return;
    e.preventDefault();
    handle.setPointerCapture(e.pointerId);
    const scroller = ul.closest('.page-body') || document.scrollingElement;
    const startY = e.clientY, startScroll = scroller.scrollTop;
    let to = from, lastY = e.clientY, raf = 0;
    li.classList.add('lifted');
    const update = () => {
      li.style.transform = `translateY(${lastY - startY + scroller.scrollTop - startScroll}px)`;
      to = items.length;
      for (let k = 0; k < items.length; k++) {
        if (items[k] === li) continue;
        const r = items[k].getBoundingClientRect();
        if (lastY < r.top + r.height / 2) { to = k; break; }
      }
      items.forEach(x => x.classList.remove('drop-before', 'drop-after'));
      const target = to < items.length ? items[to] : items[items.length - 1];
      if (target !== li) target.classList.add(to < items.length ? 'drop-before' : 'drop-after');
    };
    const tick = () => {
      const box = scroller === document.scrollingElement ? { top: 0, bottom: innerHeight } : scroller.getBoundingClientRect();
      const v = lastY < box.top + 70 ? -10 : lastY > box.bottom - 90 ? 10 : 0;
      if (v) { scroller.scrollTop += v; update(); }
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    const move = ev => { lastY = ev.clientY; update(); };
    const end = () => {
      cancelAnimationFrame(raf);
      handle.removeEventListener('pointermove', move);
      handle.removeEventListener('pointerup', end);
      handle.removeEventListener('pointercancel', end);
      li.classList.remove('lifted'); li.style.transform = '';
      items.forEach(x => x.classList.remove('drop-before', 'drop-after'));
      onMove(from, to > from ? to - 1 : to);
    };
    handle.addEventListener('pointermove', move);
    handle.addEventListener('pointerup', end);
    handle.addEventListener('pointercancel', end);
  });
}

const arrMove = (arr, from, to) => { const [x] = arr.splice(from, 1); arr.splice(to, 0, x); };
const sorters = {

// ---------- 编辑页：改名字和内容 ----------
function openEditor({ name, text, heading = '编辑' }, onSave) {
  const nameIn = h('input', { type: 'text', value: name, placeholder: '比如 须知.txt', enterkeyhint: 'next', 'aria-label': '文件名' });
  const ta = h('textarea', { class: 'editor-text', spellcheck: 'false', placeholder: '在这里输入内容…', 'aria-label': '内容' });
  ta.value = text;
  const count = h('div', { class: 'editor-count' }, fmtChars(text.length));
  ta.addEventListener('input', () => { count.textContent = fmtChars(ta.value.length); });
  nameIn.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); ta.focus(); } });
  openPage(heading, api => {
    const save = () => {
      const n = nameIn.value.replace(/[\r\n]+/g, ' ').trim();
      if (!n) { toast('文件名不能为空', true); nameIn.focus(); return; }
      if (/[<>]{3,}/.test(n)) { toast('文件名里不能有连续的 < 或 >', true); return; }
      const bad = markerLine(ta.value);
      if (bad) { toast('内容里有一行和分隔行一样，拆分会出错，请改一下：' + bad.slice(0, 30), true); return; }
      onSave(n, normalizeNL(ta.value));
      api.close(true);
    };
    api.beforeClose = () => (nameIn.value === name && ta.value === text) || confirm('有修改还没保存，确定放弃？');
    api.onKey = e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); save(); } };
    return {
      right: [h('button', { class: 'textbtn', onclick: save }, '保存')],
      body: h('div', { class: 'page-body flush' }, h('div', { class: 'editor-name' }, h('label', {}, '文件名'), nameIn), ta, count),
    };
  });
  if (!isTouch()) (name ? ta : nameIn).focus();
}

// ---------- 合并预览 ----------
const PREVIEW_LIMIT = 6000;
function previewMerged(title, files, header, foot) {
  const paras = mergedParas(title, files, header);
  const view = h('div', { class: 'doc-view' });
  let buf = [];
  const flush = () => { if (buf.length) { view.append(h('div', { class: 'p' }, buf.join('\n'))); buf = []; } };
  for (const p of paras.slice(0, PREVIEW_LIMIT)) {
    if (!p.kind || p.kind === 'plain') { buf.push(p.text); continue; }
    flush();
    view.append(h('div', { class: { title: 't', meta: 'meta', begin: 'b', end: 'e' }[p.kind] }, p.text));
  }
  flush();
  if (paras.length > PREVIEW_LIMIT) view.append(h('div', { class: 'more-note' }, `……后面还有 ${paras.length - PREVIEW_LIMIT} 行没显示，下载的文件是完整的。`));
  const total = files.reduce((n, f) => n + f.text.length, 0);
  openPage('预览', api => ({
    body: h('div', { class: 'page-body' },
      h('div', { class: 'list-head' }, `${title} · ${files.length} 个文件 · ${fmtChars(total)}`), view),
    foot: h('div', { class: 'page-foot' }, foot.filter(Boolean).map(b =>
      ibtn(b.primary ? 'primary' : '', b.icon, b.label, { onclick: () => b.run(api) }))),
  }));
}

// 手机上可以直接分享给其他 App（微信、网盘等）
const canShareFiles = () => {
  try { return !!(navigator.canShare && navigator.canShare({ files: [new File(['x'], 'x.txt', { type: 'text/plain' })] })); } catch { return false; }
};
async function shareBlob(blob, name) {
  try { await navigator.share({ files: [new File([blob], name, { type: blob.type })], title: name }); }
  catch (e) { if (e.name !== 'AbortError') { toast('分享失败，已改为下载', true); saveBlob(blob, name); } }
}

function snippet(text, q) {
  const i = text.toLowerCase().indexOf(q);
  if (i < 0) return null;
  const start = Math.max(0, i - 10), flat = s => s.replace(/\s+/g, ' ');
  return h('span', {}, (start ? '…' : '') + flat(text.slice(start, i)), h('mark', {}, text.slice(i, i + q.length)), flat(text.slice(i + q.length, i + q.length + 40)));
}

// ---------- 记录（目录里的一条） ----------
const headerOf = rec => rec.header || DEFAULT_HEADER;
const recSaved = new Set(); // 已经在目录里的记录 id

async function persistRec(rec) {
  if (!recSaved.has(rec.id)) return;
  await DB.put(rec);
  refreshCatalog();
}

const dlMerged = (rec, fmt) => run(async () => saveBlob(await mergedBlob(rec.title, rec.files, fmt, headerOf(rec)), safeName(rec.title) + '.' + fmt));
const shareMerged = (rec, fmt) => run(async () => shareBlob(await mergedBlob(rec.title, rec.files, fmt, headerOf(rec)), safeName(rec.title) + '.' + fmt));

function downloadSheet(rec) {
  sheet('下载合并文件', [
    { icon: 'download', label: '下载 docx', run: dlMerged(rec, 'docx') },
    { icon: 'download', label: '下载 txt', run: dlMerged(rec, 'txt') },
    canShareFiles() ? { icon: 'share', label: '分享给其他 App（docx）', run: shareMerged(rec, 'docx') } : null,
  ]);
}

function fileDownloadSheet(f) {
  const orig = outputOf(f.name, 'orig').name;
  sheet('下载「' + baseName(f.name) + '」', [
    { icon: 'download', label: '原格式', hint: baseName(orig), run: run(() => downloadFile(f, 'orig')) },
    { icon: 'download', label: '存成 txt', hint: baseName(outputOf(f.name, 'txt').name), run: run(() => downloadFile(f, 'txt')) },
    { icon: 'download', label: '存成 docx', hint: baseName(outputOf(f.name, 'docx').name), run: run(() => downloadFile(f, 'docx')) },
  ]);
}

const renameRec = (rec, after) => run(async () => {
  const t = prompt('新的总文件名：', rec.title);
  if (!t || !t.trim()) return;
  rec.title = t.trim();
  await persistRec(rec);
  after && after();
});
const deleteRec = (rec, after) => run(async () => {
  if (!confirm(`从目录删除「${rec.title}」？`)) return;
  await DB.del(rec.id); recSaved.delete(rec.id);
  toast('已删除'); refreshCatalog(); after && after();
});
const loadRecToMerge = rec => {
  addToMerge(rec.files.map(f => ({ ...f, type: typeOf(f.name) })), rec.title);
  closeAllLayers(); switchTab('merge'); toast('已载入合并区，可以增删后重新合并');
};
function closeAllLayers() { while (layers.length) layers[layers.length - 1].close(true); }

function recMenu(rec, refresh) {
  return [
    { icon: 'eye', label: '打开', run: () => openRecord(rec, { onChange: refresh }) },
    { icon: 'download', label: '下载合并文件', run: () => downloadSheet(rec) },
    { icon: 'zip', label: '打包 zip', run: run(() => downloadZip(rec.title, rec.files, 'orig')) },
    { icon: 'merge', label: '载入合并区', run: () => loadRecToMerge(rec) },
    { icon: 'edit', label: '重命名', run: renameRec(rec, refresh) },
    recSaved.has(rec.id) ? { icon: 'trash', label: '删除', danger: true, run: deleteRec(rec, refresh) } : null,
  ];
}

function recRow(rec, { query = '', refresh } = {}) {
  let sub = rec.files.map(f => baseName(f.name)).join('、');
  if (query) {
    const hit = rec.files.find(f => f.text.toLowerCase().includes(query) && !f.name.toLowerCase().includes(query));
    if (hit && !rec.title.toLowerCase().includes(query) && !rec.files.some(f => f.name.toLowerCase().includes(query))) {
      sub = h('span', {}, baseName(hit.name) + '：', snippet(hit.text, query));
    }
  }
  return listRow({
    avatar: h('div', { class: 'avatar ' + rec.kind }, icon(rec.kind === 'merge' ? 'files' : 'inbox')),
    title: rec.title,
    sub: recSaved.has(rec.id) ? sub : h('span', {}, h('span', { class: 'err-text' }, '未记录 · '), sub),
    right: [h('span', {}, relTime(rec.createdAt)), h('span', {}, rec.files.length + ' 个')],
    onTap: () => openRecord(rec, { onChange: refresh }),
    menu: () => recMenu(rec, refresh),
    swipe: [
      { label: '重命名', cls: 'gray', run: renameRec(rec, refresh) },
      recSaved.has(rec.id) ? { label: '删除', cls: 'red', run: deleteRec(rec, refresh) } : null,
    ].filter(Boolean),
    hover: [{ icon: 'download', label: '下载合并文件', run: () => downloadSheet(rec) }],
  });
}

// 打开一条记录：里面一个个文件，可以编辑、排序、删除、下载
function openRecord(rec, { onChange } = {}) {
  let sorting = false;
  const list = h('ul', { class: 'list' });
  const head = h('div', { class: 'list-head' });
  const summary = h('div', { class: 'summary' });
  let pageApi;
  const changed = run(async () => { render(); await persistRec(rec); onChange && onChange(); });
  const move = (from, to) => { if (from !== to) { arrMove(rec.files, from, to); changed(); } else render(); };
  const removeFile = i => run(async () => {
    const f = rec.files[i];
    if (rec.files.length === 1) {
      if (recSaved.has(rec.id) && confirm('这是最后一个文件，删掉后整条记录也会删除，确定？')) {
        await DB.del(rec.id); recSaved.delete(rec.id); refreshCatalog(); onChange && onChange(); pageApi.close(true);
      }
      return;
    }
    if (!confirm(`删除「${baseName(f.name)}」？`)) return;
    rec.files.splice(i, 1); changed(); toast('已删除');
  });
  const render = () => {
    pageApi && pageApi.setTitle(rec.title);
    const total = rec.files.reduce((n, f) => n + f.text.length, 0);
    summary.replaceChildren(
      h('div', { class: 'avatar ' + rec.kind }, icon(rec.kind === 'merge' ? 'files' : 'inbox')),
      h('div', { class: 'row-main' },
        h('div', { class: 's-title' }, rec.title),
        h('div', { class: 's-sub' }, `${rec.kind === 'merge' ? '合并' : '导入拆分'} · ${fmtTime(rec.createdAt)} · ${fmtChars(total)}`, recSaved.has(rec.id) ? '' : ' · 未记录到目录')));
    listHead(head, {
      count: `${rec.files.length} 个文件`, sorting,
      onSortMode: v => { sorting = v; render(); },
      onSort: k => { sortArr(rec.files, k); changed(); },
    });
    list.classList.toggle('sorting', sorting);
    list.replaceChildren(...rec.files.map((f, i) => {
      const edit = () => openEditor(f, (name, text) => { rec.files[i] = { name, text }; changed(); toast('已保存'); });
      return listRow({
        avatar: fileAvatar(typeOf(f.name)),
        title: f.name,
        sub: `${fmtChars(f.text.length)} · ${firstLine(f.text) || '（空）'}`,
        right: [h('span', {}, i + 1)],
        onTap: edit,
        menu: () => [
          { icon: 'edit', label: '查看 / 编辑', run: edit },
          { icon: 'download', label: '下载这个文件', run: () => fileDownloadSheet(f) },
          '-',
          { icon: 'top', label: '置顶', disabled: i === 0, run: () => move(i, 0) },
          { icon: 'up', label: '上移', disabled: i === 0, run: () => move(i, i - 1) },
          { icon: 'down', label: '下移', disabled: i === rec.files.length - 1, run: () => move(i, i + 1) },
          '-',
          { icon: 'trash', label: '删除', danger: true, run: removeFile(i) },
        ],
        swipe: [{ label: '置顶', cls: 'gray', run: () => move(i, 0) }, { label: '删除', cls: 'red', run: removeFile(i) }],
        hover: [{ icon: 'download', label: '下载', run: () => fileDownloadSheet(f) }, { icon: 'top', label: '置顶', run: () => move(i, 0) }],
      });
    }));
  };
  makeSortable(list, move);
  pageApi = openPage(rec.title, api => ({
    right: [h('button', { class: 'iconbtn', title: '更多', 'aria-label': '更多', onclick: () => sheet(rec.title, [
      recSaved.has(rec.id) ? null : { icon: 'save', label: '记录到目录', run: run(async () => { recSaved.add(rec.id); await DB.put(rec); refreshCatalog(); onChange && onChange(); render(); toast('已记录到目录'); }) },
      { icon: 'merge', label: '载入合并区（可以再加文件）', run: () => loadRecToMerge(rec) },
      { icon: 'edit', label: '重命名', run: renameRec(rec, () => { render(); onChange && onChange(); }) },
      recSaved.has(rec.id) ? { icon: 'trash', label: '删除这条记录', danger: true, run: deleteRec(rec, () => { api.close(true); onChange && onChange(); }) } : null,
    ]) }, icon('more'))],
    body: h('div', { class: 'page-body' }, summary, head, list),
    foot: h('div', { class: 'page-foot' },
      ibtn('', 'eye', '预览', { onclick: () => previewMerged(rec.title, rec.files, headerOf(rec), [
        canShareFiles() ? { icon: 'share', label: '分享', run: () => shareMerged(rec, 'docx')() } : null,
        { icon: 'download', label: '下载', primary: true, run: () => downloadSheet(rec) },
      ]) }),
      ibtn('', 'zip', '打包 zip', { onclick: run(() => downloadZip(rec.title, rec.files, 'orig')) }),
      ibtn('primary', 'download', '下载合并', { onclick: () => downloadSheet(rec) })),
  }));
  render();
}

// ---------- 合并 ----------
let mergeItems = [];
let mergeSorting = false;
let titleTouched = false;

function loadSettings() {
  let s = {};
  try { s = JSON.parse(localStorage.getItem('dms-settings') || '{}'); } catch {}
  return { format: s.format === 'txt' ? 'txt' : 'docx', save: s.save !== false, header: { ...DEFAULT_HEADER, ...(s.header || {}) } };
}
let settings = loadSettings();
function saveSettings() {
  try { localStorage.setItem('dms-settings', JSON.stringify(settings)); } catch {}
  $('#fmtChip').textContent = settings.format.toUpperCase();
}

function addToMerge(items, title) {
  mergeItems.push(...items.map(it => ({ ...it, id: uid() })));
  if (title && (!titleTouched || !$('#mergeTitle').value.trim())) { $('#mergeTitle').value = title; titleTouched = true; }
  renderMerge();
}

function editMergeItem(it) {
  openEditor(it, (name, text) => { Object.assign(it, { name, text, type: typeOf(name) }); renderMerge(); toast('已保存'); });
}

function newDoc() {
  openEditor({ name: '须知.txt', text: '', heading: '新建文档' }, (name, text) => {
    mergeItems.unshift({ id: uid(), name, text, type: typeOf(name) });
    renderMerge(); toast('已放到最前面');
  });
}

function moveMerge(from, to) { if (from !== to) arrMove(mergeItems, from, to); renderMerge(); }
const removeMerge = i => () => { mergeItems.splice(i, 1); renderMerge(); };

function renderMerge() {
  const n = mergeItems.length, ok = mergeItems.filter(it => !it.error);
  $('#mergeEmpty').classList.toggle('hidden', n > 0);
  $('#composer').classList.toggle('hidden', n === 0);
  $('#app').classList.toggle('with-composer', n > 0 && !$('#tab-merge').classList.contains('hidden'));
  $('#mergeCount').textContent = n || '';
  $('#sendBtn').disabled = !ok.length;
  if (!n) { $('#mergeHead').classList.add('hidden'); mergeSorting = false; }
  else listHead($('#mergeHead'), {
    count: `${ok.length} 个文件 · ${fmtChars(ok.reduce((s, f) => s + f.text.length, 0))}`, sorting: mergeSorting,
    onSortMode: v => { mergeSorting = v; renderMerge(); },
    onSort: k => { sortArr(mergeItems, k); renderMerge(); },
  });
  const ul = $('#mergeList');
  ul.classList.toggle('sorting', mergeSorting);
  ul.replaceChildren(...mergeItems.map((it, i) => listRow({
    avatar: fileAvatar(it.type),
    title: it.name,
    sub: it.error ? h('span', { class: 'err-text' }, it.error + '，合并时会跳过') : `${fmtChars(it.text.length)} · ${firstLine(it.text) || '（空）'}`,
    right: [h('span', {}, i + 1)],
    onTap: it.error ? null : () => editMergeItem(it),
    menu: () => [
      it.error ? null : { icon: 'edit', label: '查看 / 编辑', run: () => editMergeItem(it) },
      { icon: 'top', label: '置顶', disabled: i === 0, run: () => moveMerge(i, 0) },
      { icon: 'up', label: '上移', disabled: i === 0, run: () => moveMerge(i, i - 1) },
      { icon: 'down', label: '下移', disabled: i === n - 1, run: () => moveMerge(i, i + 1) },
      '-',
      { icon: 'x', label: '移除', danger: true, run: removeMerge(i) },
    ],
    swipe: [{ label: '置顶', cls: 'gray', run: () => moveMerge(i, 0) }, { label: '移除', cls: 'red', run: removeMerge(i) }],
    hover: [{ icon: 'top', label: '置顶', run: () => moveMerge(i, 0) }, { icon: 'x', label: '移除', run: removeMerge(i) }],
  })));
}

async function handleMergeFiles(fileList) {
  const files = [...fileList];
  if (!files.length) return;
  const items = [];
  for (const f of files) {
    const name = f.relPath || f.webkitRelativePath || f.name;
    try { items.push(...await readInputFile(name, await f.arrayBuffer())); }
    catch (e) { items.push({ name, type: 'err', size: f.size, error: e.message || '读取失败' }); }
  }
  const singleZip = files.length === 1 && extOf(files[0].name) === 'zip' ? stripExt(files[0].name) : null;
  addToMerge(items, !titleTouched && singleZip ? singleZip : null);
  const ok = items.filter(i => !i.error).length, bad = items.length - ok;
  toast(`已添加 ${ok} 个文档` + (bad ? `，${bad} 个读不了` : ''), bad > 0 && ok === 0);
}

function mergeJob() {
  const files = mergeItems.filter(it => !it.error).map(f => ({ name: f.name, text: f.text }));
  if (!files.length) return null;
  return { files, header: { ...settings.header }, format: settings.format, title: $('#mergeTitle').value.trim() || '合并_' + stamp() };
}

async function finishMerge(job, share) {
  const blob = await mergedBlob(job.title, job.files, job.format, job.header);
  const name = safeName(job.title) + '.' + job.format;
  if (share) await shareBlob(blob, name); else saveBlob(blob, name);
  if (settings.save) {
    const rec = { id: uid(), kind: 'merge', title: job.title, format: job.format, header: job.header, createdAt: Date.now(), files: job.files };
    await DB.put(rec); recSaved.add(rec.id); refreshCatalog();
  }
  toast(`已合并 ${job.files.length} 个文件` + (settings.save ? '，已记到目录' : ''));
}

// 点“合并”先看预览，确认后再下载 / 分享
function startMerge() {
  const job = mergeJob();
  if (!job) return;
  previewMerged(job.title, job.files, job.header, [
    canShareFiles() ? { icon: 'share', label: '分享', run: api => { api.close(true); run(() => finishMerge(job, true))(); } } : null,
    { icon: 'download', label: `下载 ${job.format}`, primary: true, run: api => { api.close(true); run(() => finishMerge(job, false))(); } },
  ]);
}

  openPage('合并设置', api => {
    api.beforeClose = () => {

          h('label', { class: 'cell' }, h('span', { class: 'label' }, '合并后记录到目录'), sw(settings.save, v => { settings.save = v; saveSettings(); }))),
        h('div', { class: 'group-title' }, '合并文件的开头'),
        h('div', { class: 'group' },
          h('label', { class: 'cell' }, h('span', { class: 'label' }, '标题和文件数'), tSw),

    };

}

function addMenu(anchor) {
  menuAt(anchor, [
    { icon: 'plus', label: '选择文件', run: () => $('#mergeInput').click() },
    isTouch() ? null : { icon: 'folder', label: '选择文件夹', run: () => $('#mergeDirInput').click() },
    { icon: 'filePlus', label: '新建文档', run: newDoc },
    mergeItems.length ? '-' : null,
    mergeItems.length ? { icon: 'trash', label: '清空列表', danger: true, run: () => {
      if (mergeItems.length > 3 && !confirm(`清空列表里的 ${mergeItems.length} 个文件？`)) return;
      mergeItems = []; titleTouched = false; $('#mergeTitle').value = ''; renderMerge();
    } } : null,
  ]);
}

// ---------- 拆分 ----------
const splitRecs = [];
function renderSplit() {
  $('#splitHead').classList.toggle('hidden', !splitRecs.length);
  $('#splitList').replaceChildren(...splitRecs.map(r => recRow(r, { refresh: renderSplit })));
}

async function handleSplitFiles(fileList) {
  const files = [...fileList];
  let last = null;
  for (const f of files) {
    try {
      const buf = await f.arrayBuffer();
      const text = extOf(f.name) === 'docx' ? await docxToText(buf) : decodeText(new Uint8Array(buf));
      const parsed = parseMerged(text);
      if (!parsed.files.length) { toast(`「${f.name}」里没找到分隔行，可能不是用本工具合并的`, true); continue; }
      const rec = { id: uid(), kind: 'split', title: stripExt(f.name), sourceName: f.name, createdAt: Date.now(), files: parsed.files };
      if (loadSplitSave()) { await DB.put(rec); recSaved.add(rec.id); }
      splitRecs.unshift(rec); last = rec;
      toast(`拆出 ${parsed.files.length} 个文件`);
    } catch (e) {
      console.error(e); toast(`「${f.name}」读取失败：${e.message || e}`, true);
    }
  }
  renderSplit(); refreshCatalog();
  if (last && files.length === 1) openRecord(last, { onChange: renderSplit });
}
const loadSplitSave = () => { try { return localStorage.getItem('dms-split-save') !== '0'; } catch { return true; } };

// ---------- 目录 ----------
let catKind = 'all';
async function refreshCatalog() {
  let recs = [];
  try { recs = await DB.all(); } catch (e) { console.error(e); }
  recs.forEach(r => recSaved.add(r.id));
  recs.sort((a, b) => b.createdAt - a.createdAt);
  $('#catCount').textContent = recs.length || '';
  const q = $('#catSearch').value.trim().toLowerCase();
  const shown = recs.filter(r => (catKind === 'all' || r.kind === catKind) && (!q ||
    r.title.toLowerCase().includes(q) || r.files.some(f => f.name.toLowerCase().includes(q) || f.text.toLowerCase().includes(q))));
  $('#catList').replaceChildren(...shown.map(r => recRow(r, { query: q, refresh: refreshCatalog })));
  const empty = $('#catEmpty');
  empty.textContent = recs.length ? '没有找到' : '还没有记录。合并或导入拆分后会出现在这里。';
  empty.classList.toggle('hidden', shown.length > 0);
  const info = `共 ${recs.length} 条记录，只存在这个浏览器里`;
  $('#storageInfo').textContent = info;
  if (navigator.storage && navigator.storage.estimate) {
    navigator.storage.estimate().then(s => { $('#storageInfo').textContent = `${info} · 约 ${fmtBytes(s.usage || 0)}`; }).catch(() => {});
  }
}

async function exportCatalog() {
  const recs = await DB.all();
  if (!recs.length) return toast('目录是空的');
  saveBlob(new Blob([JSON.stringify({ app: 'doc-merge-split', version: 1, records: recs })], { type: 'application/json' }), `目录备份_${stamp()}.json`);
}

async function importCatalog(file) {
  try {
    const data = JSON.parse(decodeText(new Uint8Array(await file.arrayBuffer())));
    const recs = (data.records || []).filter(r => r && r.id && r.title && Array.isArray(r.files));
    for (const r of recs) await DB.put(r);
    toast(`已导入 ${recs.length} 条记录`);
    refreshCatalog();
  } catch {
    toast('备份文件格式不对', true);
  }
}

// ---------- 拖文件进窗口（支持文件夹） ----------
async function filesFromDrop(dt) {
  const entries = [...dt.items].map(i => i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);
  if (!entries.length) return [...dt.files];
  const out = [];
  const readAll = reader => new Promise((res, rej) => {
    const acc = [];
    const next = () => reader.readEntries(batch => { if (!batch.length) res(acc); else { acc.push(...batch); next(); } }, rej);
    next();
  });
  async function walk(entry, prefix) {
    if (entry.isFile) {
      const file = await new Promise((res, rej) => entry.file(res, rej));
      if (prefix) file.relPath = prefix + file.name;
      out.push(file);
    } else if (entry.isDirectory) {
      const kids = await readAll(entry.createReader());
      kids.sort((a, b) => a.name.localeCompare(b.name, 'zh-CN', { numeric: true }));
      for (const k of kids) await walk(k, prefix + entry.name + '/');
    }
  }
  for (const e of entries) await walk(e, '');
  return out;
}

function setupWindowDrop() {
  let depth = 0;
  const hasFiles = e => [...(e.dataTransfer?.types || [])].includes('Files');
  const target = () => layers.length ? null : currentTab === 'split' ? 'split' : currentTab === 'merge' ? 'merge' : null;
  window.addEventListener('dragenter', e => {
    if (!hasFiles(e) || !target()) return;
    depth++;
    $('#dropText').textContent = target() === 'merge' ? '松手添加到合并列表' : '松手导入并拆分';
    document.body.classList.add('dragging-files');
  });
  window.addEventListener('dragleave', () => { if (--depth <= 0) { depth = 0; document.body.classList.remove('dragging-files'); } });
  window.addEventListener('dragover', e => e.preventDefault());
  window.addEventListener('drop', async e => {
    e.preventDefault(); depth = 0; document.body.classList.remove('dragging-files');
    const t = target();
    if (!t || !hasFiles(e)) return;
    if (t === 'merge') handleMergeFiles(await filesFromDrop(e.dataTransfer));
    else handleSplitFiles(e.dataTransfer.files);
  });
}

// ---------- 页面切换 / 顶栏 ----------
let currentTab = 'merge';
const TAB_NAMES = { merge: '合并', split: '拆分', catalog: '目录' };
function switchTab(name) {
  currentTab = name;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
  for (const id of Object.keys(TAB_NAMES)) $('#tab-' + id).classList.toggle('hidden', id !== name);
  $('#pageName').textContent = TAB_NAMES[name];
  $('#app').classList.toggle('with-composer', name === 'merge' && mergeItems.length > 0);
  closeSwipe();
  const acts = $('#appbarActions');
  if (name === 'merge') acts.replaceChildren(h('button', { class: 'iconbtn', title: '添加', 'aria-label': '添加', onclick: e => addMenu(e.currentTarget) }, icon('plusCircle')));
  if (name === 'split') acts.replaceChildren(h('button', { class: 'iconbtn', title: '导入文件', 'aria-label': '导入文件', onclick: () => $('#splitInput').click() }, icon('plusCircle')),
    h('button', { class: 'iconbtn', title: '设置', 'aria-label': '设置', onclick: e => {
      const on = loadSplitSave();
      menuAt(e.currentTarget, [{ icon: on ? 'check' : 'x', label: on ? '导入后记录到目录：开' : '导入后记录到目录：关', run: () => {
        try { localStorage.setItem('dms-split-save', on ? '0' : '1'); } catch {}
        toast(on ? '以后导入不自动记录' : '以后导入会自动记录');
      } }]);
    } }, icon('settings')));
  if (name === 'catalog') acts.replaceChildren(h('button', { class: 'iconbtn', title: '更多', 'aria-label': '更多', onclick: e => menuAt(e.currentTarget, [
    { icon: 'download', label: '导出备份', run: exportCatalog },
    { icon: 'upload', label: '导入备份', run: () => $('#importCatInput').click() },
    '-',
    { icon: 'trash', label: '清空目录', danger: true, run: async () => {
      if (!confirm('确定清空整个目录？清空后找不回来（建议先导出备份）。')) return;
      await DB.clear(); recSaved.clear(); refreshCatalog(); toast('目录已清空');
    } },
  ]) }, icon('more')));
  try { localStorage.setItem('dms-tab', name); } catch {}
  if (name === 'catalog') refreshCatalog();
}

function setupTheme() {
  const root = document.documentElement;
  const mq = matchMedia('(prefers-color-scheme: dark)');
  const isDark = () => root.dataset.theme ? root.dataset.theme === 'dark' : mq.matches;
  const btn = $('#themeBtn');
  const paint = () => {
    const dark = isDark();
    btn.replaceChildren(icon(dark ? 'sun' : 'moon'));
    btn.title = dark ? '切换到浅色模式' : '切换到深夜模式';
    btn.setAttribute('aria-label', btn.title);
  };
  try { const t = localStorage.getItem('dms-theme'); if (t) root.dataset.theme = t; } catch {}
  btn.addEventListener('click', () => {
    const t = isDark() ? 'light' : 'dark';
    root.dataset.theme = t;
    try { localStorage.setItem('dms-theme', t); } catch {}
    paint();
  });
  mq.addEventListener('change', paint);
  paint();
}

(async function main() {
  document.querySelectorAll('i[data-i]').forEach(el => el.replaceWith(icon(el.dataset.i, el.dataset.c || '')));
  setupTheme();
  if (/MicroMessenger/i.test(navigator.userAgent)) $('#wxTip').classList.remove('hidden');
  document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => switchTab(t.dataset.tab)));
  setupWindowDrop();
  const onPick = (input, fn) => input.addEventListener('change', () => { fn(input.files); input.value = ''; });
  onPick($('#mergeInput'), handleMergeFiles);
  onPick($('#mergeDirInput'), handleMergeFiles);
  onPick($('#splitInput'), handleSplitFiles);
  $('#importCatInput').addEventListener('change', e => { if (e.target.files[0]) importCatalog(e.target.files[0]); e.target.value = ''; });
  $('#emptyPick').addEventListener('click', () => $('#mergeInput').click());
  $('#emptyNew').addEventListener('click', newDoc);
  $('#splitPick').addEventListener('click', () => $('#splitInput').click());
  makeSortable($('#mergeList'), moveMerge);
  $('#mergeTitle').addEventListener('input', () => { titleTouched = true; });
  $('#mergeTitle').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); e.target.blur(); startMerge(); } });
  $('#mergeTitle').placeholder = '总文件名（可不填）';
  $('#fmtChip').addEventListener('click', () => { settings.format = settings.format === 'docx' ? 'txt' : 'docx'; saveSettings(); toast('输出格式：' + settings.format); });
  $('#openSettings').addEventListener('click', openSettingsPage);
  $('#sendBtn').addEventListener('click', startMerge);
  let searchTimer;
  $('#catSearch').addEventListener('input', () => { clearTimeout(searchTimer); searchTimer = setTimeout(refreshCatalog, 200); });
  $('#catFilter').addEventListener('click', e => {
    const c = e.target.closest('.chip');
    if (!c) return;
    catKind = c.dataset.k;
    document.querySelectorAll('#catFilter .chip').forEach(x => x.classList.toggle('on', x === c));
    refreshCatalog();
  });
  saveSettings();
  renderMerge();
  await DB.init();
  let tab = 'merge';
  try { tab = localStorage.getItem('dms-tab') || 'merge'; } catch {}
  switchTab(TAB_NAMES[tab] ? tab : 'merge');
  refreshCatalog();
})();
</script>
